services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-receptionist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: praktika_user
      POSTGRES_PASSWORD: praktika_password_secure_2026
      POSTGRES_DB: praktika
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praktika_user -d praktika"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-receptionist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-reception-zeroweb
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://praktika_user:praktika_password_secure_2026@postgres:5432/praktika
    volumes:
      - app_sessions:/app/sessions
      - app_data:/app/data

volumes:
  pg_data:
  app_sessions:
  app_data:
